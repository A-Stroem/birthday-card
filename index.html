<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Birthday celebration card">
  <title>Happy Birthday!</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Special+Elite&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Main Container -->
  <main class="birthday-card">
    <div class="card-stage">
      <div class="card-book" id="cardBook">
        <!-- Hero Section -->
        <section class="hero card-inside" id="cardInside">
          <!-- Norwegian Greeting (conditionally shown) -->
          <div class="norwegian-greeting" id="norwegianGreeting"></div>

          <!-- Name Display -->
          <h1 class="name" id="name"></h1>

          <!-- Age with 25th Milestone Badge -->
          <div class="age-container">
            <div class="age" id="age"></div>
            <div class="milestone-badge" id="milestoneBadge"></div>
          </div>

          <!-- Photo -->
          <div class="photo-container">
            <div class="photo-frame">
              <img id="photo" class="photo" alt="Birthday celebration photo" />
              <div class="photo-skeleton" id="photoSkeleton"></div>
              <div class="photo-error" id="photoError"></div>
            </div>
          </div>

          <!-- Birthday Message -->
          <p class="message" id="message"></p>

          <!-- Inside Note (from config.js) -->
          <div class="inside-note">
            <p class="inside-note-text" id="insideNote"></p>
          </div>

          <!-- Audio Player (conditionally shown) -->
          <div class="audio-player" id="audioPlayer">
            <button class="audio-button" id="audioButton" aria-label="Play birthday music">
              <span class="audio-icon" aria-hidden="true">♫</span>
              <span class="audio-label" id="audioLabel"></span>
            </button>
          </div>
        </section>

        <button
          class="card-cover"
          id="cardCover"
          type="button"
          aria-controls="cardInside"
          aria-label="Open birthday card"
        >
          <span class="cover-title">Happy Birthday</span>
          <span class="cover-subtitle" id="coverName"></span>
          <span class="cover-hint">Tap to open</span>
        </button>
      </div>

      <div class="card-actions">
        <button
          class="card-toggle-button"
          id="cardToggleButton"
          type="button"
          aria-controls="cardInside"
          aria-expanded="false"
        >
          Open Card
        </button>
      </div>
    </div>

    <!-- Confetti Canvas -->
    <canvas class="confetti-canvas" id="confettiCanvas" aria-hidden="true">
      Animated confetti celebration
    </canvas>

    <!-- Error Display -->
    <div class="error-display" id="errorDisplay"></div>

  </main>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
